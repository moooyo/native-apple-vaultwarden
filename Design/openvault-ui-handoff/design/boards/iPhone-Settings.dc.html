    <div class="grp" style="margin: 0 16px; --inset: 58px">

        <button class="{{faceCls}}" role="switch" aria-checked="{{faceChecked}}" aria-label="面容 ID 解锁" onClick="{{toggleFace}}"></button>
      </div>
      <button class="row" onClick="{{nextLock}}" style="width: 100%; border: 0; background: none; text-align: left">
        <span class="sq" style="background: var(--orange)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg></span>
        <span class="grow bd">自动锁定</span>
        <span class="bd s2">{{lockText}}</span>
        <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </button>
      <button class="row" onClick="{{nextClip}}" style="width: 100%; border: 0; background: none; text-align: left">
        <span class="sq" style="background: var(--blue)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="11" height="12" rx="2.5"/><path d="M16 8V6.5A2.5 2.5 0 0 0 13.5 4h-6A2.5 2.5 0 0 0 5 6.5v8A2.5 2.5 0 0 0 7.5 17H8"/></svg></span>
        <span class="grow bd">清空剪贴板</span>
        <span class="bd s2">{{clipText}}</span>
        <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg>
      </button>
    </div>

    <div class="hdr" style="padding-top: 18px">自动填充</div>
    <div class="grp" style="margin: 0 16px">
      <button class="row" onClick="{{openSys}}" style="width: 100%; border: 0; background: none; text-align: left">
        <span class="sq" style="background: var(--indigo)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg></span>
        <span class="grow bd">密码与通行密钥填充</span>
        <span class="bd s2">{{sysText}}</span>
        <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M14 4.5h5.5V10M19.5 4.5L11 13M17 14v4a2 2 0 0 1-2 2H6.5a2 2 0 0 1-2-2V9.5a2 2 0 0 1 2-2h4"/></svg>
      </button>
    </div>

    <div class="hdr" style="padding-top: 18px">外观</div>
    <div style="margin: 0 16px">
      <div class="seg" role="radiogroup" aria-label="外观"><sc-for list="{{themes}}" as="t" hint-placeholder-count="3"><button class="{{t.cls}}" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for></div>
    </div>
    <div class="hdr" style="padding-top: 18px">保险库</div>
    <div class="grp" style="margin: 0 16px; --inset: 58px">
      <a href="iPhone-Folders.dc.html" class="row">
        <span class="sq" style="background: var(--cyan)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg></span>
        <span class="grow bd">文件夹</span>
        <span class="bd s2">3 个</span>
        <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
      <a href="iPhone-ImportExport.dc.html" class="row">
        <span class="sq" style="background: var(--gray)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 7l4-4 4 4M12 3v11M5 13v5.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V13"/></svg></span>
        <span class="grow bd">导入与导出</span>
        <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
      </a>
    </div>

    <div class="grp" style="margin: 16px 16px 0">
      <a href="iPhone-Unlock.dc.html" class="row" style="justify-content: center"><span class="bd tint" style="font-weight: 500">立即锁定</span></a>
      <button class="row" onClick="{{logout}}" style="width: 100%; border: 0; background: none; justify-content: center"><span class="bd danger" style="font-weight: 500">退出登录</span></button>
    </div>
    <p class="fn s2" style="text-align: center; margin: 12px 0 0">OpenVault 1.0（42）</p>
  </div>

  <div class="edgefade"></div>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabs glass">
      <a href="Main.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.6l7.6 3v5.6c0 5-3.2 8.6-7.6 10.4-4.4-1.8-7.6-5.4-7.6-10.4V5.6z M12 8.2a2.2 2.2 0 0 0-1.1 4.1V15a1.1 1.1 0 0 0 2.2 0v-2.7A2.2 2.2 0 0 0 12 8.2z"/></svg>保险库
      </a>
      <a href="iPhone-Codes.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z M11.1 7v5.6l3.9 2.4.9-1.5-3.1-1.9V7z"/></svg>验证码
      </a>
      <a href="iPhone-Send.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 2.7L3 9.9c-.9.4-.9 1.6 0 2l7.1 2.9 2.9 7.1c.4.9 1.6.9 2 0z"/></svg>Send

      <a href="iPhone-Generator.dc.html" class="tab">

      </a>

      <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--gray); color: var(--on-fill); display: grid; place-items: center; font-size: 15px; font-weight: 600; box-shadow: 0 0 0 2.5px var(--tint); ">LC</span>
    </a>
  </nav>

  <sc-if value="{{askLogout}}" hint-placeholder-val="{{ false }}">
    <div class="dimmer" style="z-index: 35"></div>
    <div class="palert glass" role="alertdialog" aria-label="退出登录">
      <h2>退出登录？</h2>
      <p>这台 iPhone 上的保险库缓存会被删除。未同步的修改会丢失。</p>
      <div class="acts"><button onClick="{{cancelLogout}}">取消</button><a href="iPhone-Login.dc.html" class="dg">退出登录</a></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { face: true, theme: 'system', syncing: false, lock: 2, clip: 1, logout: false, sys: false };
  }
  componentWillUnmount() {
    clearTimeout(this.syncTimer);
    clearTimeout(this.sysTimer);
  }
  renderVals() {
    const s = this.state;
    const dark = s.theme === 'dark' || (s.theme === 'system' && (this.props.dark ?? false));
    const names = { system: '跟随系统', light: '浅色', dark: '深色' };
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      askLogout: s.logout, logout: () => this.setState({ logout: true }), cancelLogout: () => this.setState({ logout: false }),
      sysText: s.sys ? '已打开“设置”' : '系统设置',
      openSys: () => { clearTimeout(this.sysTimer); this.setState({ sys: true }); this.sysTimer = setTimeout(() => this.setState({ sys: false }), 2400); },
      lockText: ['立即', '1 分钟后', '5 分钟后', '15 分钟后', '1 小时后'][s.lock],
      nextLock: () => this.setState({ lock: (s.lock + 1) % 5 }),
      clipText: ['30 秒', '1 分钟', '2 分钟', '永不'][s.clip],
      nextClip: () => this.setState({ clip: (s.clip + 1) % 4 }),
      faceCls: s.face ? 'tg on' : 'tg',
      faceChecked: s.face ? 'true' : 'false',
      toggleFace: () => this.setState({ face: !s.face }),
      syncDot: s.syncing ? 'var(--tint)' : 'var(--ok)',
      syncText: s.syncing ? '正在同步…' : '已同步 · 2 分钟前',
      sync: () => {
        this.setState({ syncing: true });
        clearTimeout(this.syncTimer);
        this.syncTimer = setTimeout(() => this.setState({ syncing: false }), 1600);
      },
      themes: ['system', 'light', 'dark'].map((t) => ({
        label: names[t], cls: s.theme === t ? 'on' : '', checked: s.theme === t ? 'true' : 'false',
        pick: () => this.setState({ theme: t })
      }))
    };
  }
}
</script>
</body>
</html>
