<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {

      { name: '信用卡', sub: 'Mastercard •••• 7710', bg: 'var(--indigo)', glyph: '卡', type: 'card', d: 1109 },
      { name: 'Google', sub: 'lin.chen@example.com', bg: '#3A78E0', glyph: 'G', type: 'login', totp: true, d: 1028 },

      { name: '家庭 Wi‑Fi', sub: '安全笔记', bg: 'var(--cyan)', glyph: 'W', type: 'note', d: 120 },
      { name: 'Microsoft', sub: 'lin.chen@example.com', bg: '#0067B8', glyph: 'M', type: 'login', totp: true, d: 1015 },

      { name: '微信', sub: 'linchen_wx', bg: '#07A35A', glyph: '微', type: 'login', d: 630 }
    ];
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const chipDefs = [['all', '全部', 16], ['login', '登录', 9], ['totp', '验证码', 5], ['card', '银行卡', 2], ['identity', '身份', 2], ['note', '安全笔记', 2], ['ssh', 'SSH 密钥', 1]];
    const test = (i) => s.filter === 'all' || (s.filter === 'totp' ? !!i.totp : i.type === s.filter);
    const rows = this.items.filter(test).slice().sort((a, b) => s.sort === 'date' ? b.d - a.d : (s.sort === 'type' ? a.type.localeCompare(b.type) || a.name.localeCompare(b.name, 'zh-CN') : a.name.localeCompare(b.name, 'zh-CN')));
    const sortNames = { name: '按名称', date: '按修改日期', type: '按类型' };
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      chips: chipDefs.map((c) => ({ label: c[1], n: c[2], cls: s.filter === c[0] ? 'chip on' : 'chip', pressed: s.filter === c[0] ? 'true' : 'false', pick: () => this.setState({ filter: c[0] }) })),
      showOverview: s.filter === 'all',
      listTitle: s.filter === 'all' ? '全部条目' : chipDefs.find((c) => c[0] === s.filter)[1],
      sortLabel: sortNames[s.sort],
      rows: rows.map((i) => ({ name: i.name, sub: i.sub, bg: i.bg, glyph: i.glyph, fg: i.fg || (i.bg.indexOf('var(') === 0 ? 'var(--on-fill)' : '#fff') })),
      folders: [['工作', 6], ['个人', 5], ['金融', 3]].concat(s.extra.map((n) => [n, 0])).map((f) => ({ name: f[0], n: f[1], icon: 'M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z' })).concat([{ name: '无文件夹', n: 2, icon: 'M4 13.5l2.5-7h11l2.5 7v4.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18zM4 13.5h4.5l1 2h5l1-2H20' }]),
      sortOpen: s.sortOpen, sortExpanded: s.sortOpen ? 'true' : 'false',
      toggleSort: () => this.setState({ sortOpen: !s.sortOpen }),
      sorts: [['name', '名称'], ['date', '修改日期'], ['type', '类型']].map((o) => ({ label: o[1], checked: s.sort === o[0] ? 'true' : 'false', mark: s.sort === o[0] ? '✓' : '', pick: () => this.setState({ sort: o[0], sortOpen: false }) })),
      closeAll: () => this.setState({ sortOpen: false, folderAsk: false }),
      folderAsk: s.folderAsk,
      askFolder: () => this.setState({ folderAsk: true, newName: '旅行' }),
      newName: s.newName,
      onNewName: (e) => this.setState({ newName: e.target.value }),
      addFolder: () => this.setState({ extra: s.newName.trim() ? s.extra.concat([s.newName.trim()]) : s.extra, folderAsk: false })
    };
  }
}
</script>
