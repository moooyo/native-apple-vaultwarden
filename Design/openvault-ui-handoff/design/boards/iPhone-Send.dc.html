<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>Send · iPhone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 402px; height: 874px">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 48px; z-index: 40; pointer-events: none; color: var(--label)">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -.4px">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z"/></svg><svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill: none; stroke: currentColor; opacity: .4"/><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" style="fill: currentColor; opacity: .4"/></svg></span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: black; z-index: 40; pointer-events: none"></div>


  <div style="position: absolute; left: 0; right: 0; top: 62px; height: 52px; padding: 0 16px 0 20px; display: flex; align-items: center; gap: 12px; z-index: 6">
    <h1 class="lt m" style="flex: 1; min-width: 0">Send</h1>
    <a href="iPhone-SendNew.dc.html" class="gbtn glass" aria-label="新建 Send"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 114px; bottom: 0">

    <div style="display: flex; gap: 8px; padding: 12px 16px 0">
      <sc-for list="{{filters}}" as="f" hint-placeholder-count="3">
        <button class="{{f.cls}}" onClick="{{f.pick}}" aria-pressed="{{f.pressed}}">{{f.label}} <span class="n">{{f.n}}</span></button>
      </sc-for>
    </div>

    <div class="grp" style="margin: 18px 16px 0; --inset: 64px">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="3">
        <div class="row" style="min-height: 72px; padding-top: 0; padding-bottom: 0">
          <button onClick="{{r.open}}" aria-label="查看“{{r.name}}”" style="flex: 1; min-width: 0; align-self: stretch; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 8px 0; text-align: left; color: inherit">
          <span class="bt" style="width: 36px; height: 36px; background: var(--fill); color: var(--label2)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="width: 20px; height: 20px"><path d="{{r.icon}}"/></svg></span>
          <span class="grow">
            <span class="bd ell" style="display: block">{{r.name}}</span>
            <span class="sh s2 ell" style="display: block">{{r.sub}}</span>
            <sc-if value="{{r.hasBadge}}" hint-placeholder-val="{{ false }}"><span class="badge" style="display: inline-block; margin-top: 4px">{{r.badge}}</span></sc-if>
          </span>
          </button>
          <span class="{{r.hint}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已拷贝</span>
          <sc-if value="{{r.idle}}" hint-placeholder-val="{{ true }}"><button class="gbtn" onClick="{{r.copy}}" aria-label="{{r.copyLabel}}" style="background: var(--fill); color: var(--tint); width: 40px; height: 40px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><path d="M10 14a4 4 0 0 0 5.7 0l3-3a4 4 0 0 0-5.7-5.7l-1 1M14 10a4 4 0 0 0-5.7 0l-3 3a4 4 0 0 0 5.7 5.7l1-1"/></svg></button></sc-if>
        </div>
      </sc-for>
    </div>
  </div>

  <div class="edgefade"></div>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabs glass">
      <a href="Main.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.6l7.6 3v5.6c0 5-3.2 8.6-7.6 10.4-4.4-1.8-7.6-5.4-7.6-10.4V5.6z M12 8.2a2.2 2.2 0 0 0-1.1 4.1V15a1.1 1.1 0 0 0 2.2 0v-2.7A2.2 2.2 0 0 0 12 8.2z"/></svg>保险库
      </a>
      <a href="iPhone-Codes.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z M11.1 7v5.6l3.9 2.4.9-1.5-3.1-1.9V7z"/></svg>验证码
      </a>
      <a href="iPhone-Send.dc.html" class="tab on" aria-current="page">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 2.7L3 9.9c-.9.4-.9 1.6 0 2l7.1 2.9 2.9 7.1c.4.9 1.6.9 2 0z"/></svg>Send
      </a>
      <a href="iPhone-Generator.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.1 6.1 6.1 2.1-6.1 2.1L12 19l-2.1-6.2-6.1-2.1 6.1-2.1z"/><path d="M19 15.2l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>生成器
      </a>
    </div>
    <a href="iPhone-Settings.dc.html" class="tabsearch glass" aria-label="账户与设置">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--gray); color: var(--on-fill); display: grid; place-items: center; font-size: 15px; font-weight: 600; ">LC</span>
    </a>
  </nav>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{ false }}">
    <div class="toast glass" role="status" style="bottom: 104px"><svg class="ic s ok" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>{{toast}}</div>
  </sc-if>

  <sc-if value="{{detailOpen}}" hint-placeholder-val="{{ false }}">
    <button class="dimmer" aria-label="关闭详情" tabindex="-1" style="border: 0; padding: 0; width: 100%" onClick="{{closeDetail}}"></button>
    <section class="sheet" role="dialog" aria-label="{{d.name}}" style="top: 300px">
      <div class="grab"></div>
      <div style="display: flex; align-items: center; gap: 12px; padding: 4px 16px 0; height: 56px">
        <button class="gbtn glass" aria-label="关闭" onClick="{{closeDetail}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
        <h1 class="hl m ell" style="flex: 1; text-align: center">{{d.name}}</h1>
        <a href="iPhone-SendNew.dc.html" class="gtext glass">编辑</a>
      </div>
      <div style="padding: 12px 16px 0">
        <div class="grp">
          <button class="row irow" style="min-height: 64px" onClick="{{copyLink}}" aria-label="拷贝链接">
            <div class="grow" style="min-width: 0"><div class="flabel">链接</div><div class="bd mono ell" style="font-size: 15px">{{d.link}}</div></div>
            <span class="{{linkHint}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>已拷贝</span>
          </button>
        </div>
        <div class="grp" style="margin-top: 16px">
          <sc-for list="{{d.rows}}" as="r" hint-placeholder-count="4">
            <div class="row" style="min-height: 46px"><span class="bd" style="flex: none">{{r.k}}</span><span class="bd s2" style="flex: 1; text-align: right">{{r.v}}</span></div>
          </sc-for>
        </div>
        <div style="display: flex; gap: 12px; margin-top: 20px">
          <button class="bfill" style="flex: 1" onClick="{{share}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5v11M8 7.5l4-4 4 4M6 11v8.5h12V11"/></svg>共享…</button>
          <button class="bfill" style="flex: 1; color: var(--danger)" onClick="{{askDelete}}">删除</button>
        </div>
      </div>
    </section>
  </sc-if>

  <sc-if value="{{alertDelete}}" hint-placeholder-val="{{ false }}">
    <div class="dimmer" style="z-index: 35"></div>
    <div class="palert glass" role="alertdialog" aria-label="删除 Send">
      <h2>删除“{{d.name}}”？</h2>
      <p>链接会立即失效，接收者将无法再打开。</p>
      <div class="acts"><button onClick="{{closeAlert}}">取消</button><button class="dg" onClick="{{confirmDelete}}">删除</button></div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { filter: 'all', copied: '', open: '', alert: false, gone: [], toast: '' };
    this.sends = [
      { id: 'wifi', type: 'text', name: '访客 Wi‑Fi', sub: '7 天后删除 · 已访问 2/10 次', slug: 'Xk3vQ9bLm0aT2s4R/7HcPzW1qYdN8eKfG3uJtVb', rows: [['删除时间', '7 天后'], ['过期时间', '不过期'], ['访问次数', '2 / 10'], ['访问密码', '未设置']] },
      { id: 'contract', type: 'file', name: '租房合同.pdf', sub: '2 天后删除 · 已访问 1/5 次', badge: '有密码', slug: 'p2RtYc8NwE5gHq1L/a9LkD3sVxQ0mBz7TfRn2Ue', rows: [['删除时间', '2 天后'], ['过期时间', '1 天后'], ['访问次数', '1 / 5'], ['访问密码', '已设置']] },
      { id: 'token', type: 'text', name: '部署用临时口令', sub: '3 天后删除 · 链接已失效', badge: '已过期', slug: 'Jm7aZ2xK0rP4bW9e/Qe5Tn1cYwL8vHs3GdKp0Ma', rows: [['删除时间', '3 天后'], ['过期时间', '已过期'], ['访问次数', '1 / 1'], ['访问密码', '未设置']] }
    ];
  }
  componentWillUnmount() {
    clearTimeout(this.copyTimer);
    clearTimeout(this.toastTimer);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const all = this.sends.filter((x) => s.gone.indexOf(x.id) < 0);
    const list = all.filter((x) => s.filter === 'all' || x.type === s.filter);
    const cur = all.find((x) => x.id === s.open);
    const say = (t, extra) => { clearTimeout(this.toastTimer); this.setState(Object.assign({ toast: t }, extra || {})); this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 2400); };
    return {
      countText: all.length + ' 个 Send' + (all.some((x) => x.id === 'token') ? ' · 1 个已过期' : ''),
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      filters: [['all', '全部'], ['text', '文本'], ['file', '文件']].map((f) => ({
        label: f[1], n: all.filter((x) => f[0] === 'all' || x.type === f[0]).length,
        cls: s.filter === f[0] ? 'chip on' : 'chip', pressed: s.filter === f[0] ? 'true' : 'false',
        pick: () => this.setState({ filter: f[0] })
      })),
      rows: list.map((x) => ({
        name: x.name, sub: x.sub, icon: x.type === 'file' ? 'M6 3.5h8.5L19 8v12.5H6zM14 3.5V8.5h5' : 'M6 3.5h8.5L19 8v12.5H6zM14 3.5V8.5h5M9 13h7M9 16.5h5',
        hasBadge: !!x.badge, badge: x.badge || '',
        copyLabel: '拷贝“' + x.name + '”的链接',
        hint: s.copied === x.id ? 'ihint on' : 'ihint', idle: s.copied !== x.id,
        copy: () => { clearTimeout(this.copyTimer); this.setState({ copied: x.id }); this.copyTimer = setTimeout(() => this.setState({ copied: '' }), 1600); },
        open: () => this.setState({ open: x.id })
      })),
      detailOpen: !!cur, closeDetail: () => this.setState({ open: '' }),
      d: cur ? { name: cur.name, link: 'https://vault.example.com/#/send/' + cur.slug, rows: cur.rows.map((r) => ({ k: r[0], v: r[1] })) } : { name: '', link: '', rows: [] },
      linkHint: cur && s.copied === 'detail-' + cur.id ? 'ihint on' : 'ihint',
      copyLink: () => { if (!cur) return; clearTimeout(this.copyTimer); this.setState({ copied: 'detail-' + cur.id }); this.copyTimer = setTimeout(() => this.setState({ copied: '' }), 1600); },
      share: () => say('已打开共享面板'),
      askDelete: () => this.setState({ alert: true }),
      alertDelete: !!s.alert && !!cur, closeAlert: () => this.setState({ alert: false }),
      confirmDelete: () => { if (cur) say('已删除“' + cur.name + '”', { gone: s.gone.concat([cur.id]), open: '', alert: false }); },
      hasToast: !!s.toast, toast: s.toast,
    };
  }
}
</script>
</body>
</html>
