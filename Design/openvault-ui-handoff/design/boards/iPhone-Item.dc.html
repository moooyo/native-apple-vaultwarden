    <div>
      <div class="grp">

  </sc-if>
  <sc-if value="{{editing}}" hint-placeholder-val="{{ false }}">
  <div style="position: absolute; left: 16px; right: 16px; top: 262px; bottom: 0; overflow: auto; padding-bottom: 140px; display: flex; flex-direction: column; gap: 16px">
    <div class="grp">

      <label class="row"><span class="bd" style="width: 84px; flex: none">验证码</span><input class="field mono" value="JBSW Y3DP EHPK 3PXP" aria-label="验证器密钥" style="font-size: 16px"></label>
    </div>
    <div class="grp">
      <label class="row"><span class="bd" style="width: 84px; flex: none">网站</span><input class="field" value="https://github.com/login" aria-label="网站"></label>
      <button class="row" onClick="{{nextFolder}}" style="width: 100%; border: 0; background: none; text-align: left"><span class="bd" style="width: 84px; flex: none">文件夹</span><span class="bd s2" style="flex: 1">{{folder}}</span><svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
    </div>
    <div class="grp">
      <label class="row" style="align-items: flex-start; min-height: 76px; padding-top: 14px"><span class="bd" style="width: 84px; flex: none">备注</span><textarea class="field" aria-label="备注" style="resize: none; height: 52px">恢复码另存在安全笔记“GitHub 恢复码”。</textarea></label>

      </a>
      <a href="iPhone-Codes.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z M11.1 7v5.6l3.9 2.4.9-1.5-3.1-1.9V7z"/></svg>验证码
      </a>
      <a href="iPhone-Send.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 2.7L3 9.9c-.9.4-.9 1.6 0 2l7.1 2.9 2.9 7.1c.4.9 1.6.9 2 0z"/></svg>Send
      </a>
      <a href="iPhone-Generator.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.1 6.1 6.1 2.1-6.1 2.1L12 19l-2.1-6.2-6.1-2.1 6.1-2.1z"/><path d="M19 15.2l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>生成器

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { now: Date.now(), revealed: false, copied: '', fav: true, menuOpen: false, editing: false, name: 'GitHub', draft: 'GitHub', pw: 'k7Rm-q2Vx-Tp9e-Lw4N', folder: 0 };
  }
  componentDidMount() {
    this.timer = setInterval(() => this.setState({ now: Date.now() }), 1000);
  }
  componentWillUnmount() {
    clearInterval(this.timer);
    clearTimeout(this.copyTimer);
  }
  code(seed, win) {
    let h = 2166136261;
    const s = seed + ':' + win;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); }
    const t = String((h >>> 0) % 1000000).padStart(6, '0');
    return t.slice(0, 3) + ' ' + t.slice(3);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const sec = Math.floor(this.state.now / 1000);
    const left = 30 - (sec % 30);
    const code = this.code('github', Math.floor(sec / 30));
    const flash = (k) => () => { clearTimeout(this.copyTimer); this.setState({ copied: k }); this.copyTimer = setTimeout(() => this.setState({ copied: '' }), 1600); };
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      pwChars: (this.state.revealed ? this.state.pw : '••••••••••••••').split('').map((c) => ({ c: c, color: !this.state.revealed ? 'var(--label)' : /[0-9]/.test(c) ? 'var(--digit)' : /[A-Za-z]/.test(c) ? 'var(--label)' : 'var(--sym)' })),
      pwSpacing: this.state.revealed ? '0.5px' : '2px',
      revealLabel: this.state.revealed ? '隐藏密码' : '显示密码',
      eyeIcon: this.state.revealed ? 'M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5zM4 4l16 16' : 'M2.5 12s3.5-6.5 9.5-6.5 9.5 6.5 9.5 6.5-3.5 6.5-9.5 6.5S2.5 12 2.5 12zM12 9.5a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5z',
      toggleReveal: () => this.setState({ revealed: !this.state.revealed }),
      code: code,
      seconds: left,
      barWidth: (left / 30 * 100).toFixed(1),
      barClass: left <= 5 ? 'tline low' : 'tline',
      userHint: this.state.copied === 'user' ? 'ihint on' : 'ihint',
      pwHint: this.state.copied === 'pw' ? 'ihint on' : 'ihint',
      codeHint: this.state.copied === 'code' ? 'ihint on' : 'ihint',
      favLabel: this.state.fav ? '取消置顶' : '置顶', favPressed: this.state.fav ? 'true' : 'false', favFill: this.state.fav ? 'currentColor' : 'none',
      toggleFav: () => this.setState({ fav: !this.state.fav }),
      menuOpen: this.state.menuOpen, menuExpanded: this.state.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !this.state.menuOpen }),
      closeMenu: () => this.setState({ menuOpen: false }),
      copyUrl: () => { this.setState({ menuOpen: false }); flash('url')(); },
      copyUser: flash('user'),
      copyPw: flash('pw'),
      copyCode: flash('code'),
      editing: !!this.state.editing, notEditing: !this.state.editing, name: this.state.name,
      startEdit: () => this.setState({ editing: true, draft: this.state.name, menuOpen: false }),
      cancelEdit: () => this.setState({ editing: false }),
      saveEdit: () => this.setState({ editing: false, name: this.state.draft.trim() || this.state.name }),
      draft: this.state.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      pwValue: this.state.pw,
      regenPw: () => { const a = 'ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789'; let o = ''; for (let i = 0; i < 16; i++) { o += a[Math.floor(Math.random() * a.length)]; if (i % 4 === 3 && i < 15) o += '-'; } this.setState({ pw: o }); },
      folder: ['工作', '个人', '金融', '无文件夹'][this.state.folder], nextFolder: () => this.setState({ folder: (this.state.folder + 1) % 4 })
    };
  }
}
</script>
