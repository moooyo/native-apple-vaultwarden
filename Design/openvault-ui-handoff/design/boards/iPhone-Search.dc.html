<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>搜索 · iPhone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 402px; height: 874px">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 48px; z-index: 40; pointer-events: none; color: var(--label)">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -.4px">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z"/></svg><svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill: none; stroke: currentColor; opacity: .4"/><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" style="fill: currentColor; opacity: .4"/></svg></span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: black; z-index: 40; pointer-events: none"></div>


  <div style="position: absolute; left: 0; right: 0; top: 114px; bottom: 0; overflow: auto; padding-bottom: 130px">
    <div class="hdr" style="padding: 12px 20px 10px">按类型查找</div>
    <div style="display: flex; flex-wrap: wrap; gap: 8px; padding: 0 16px">
      <button class="{{chip_login}}" aria-pressed="{{pressed_login}}" onClick="{{pick_login}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><circle cx="8" cy="15" r="4"/><path d="M10.8 12.2L20 3M16 7l3 3"/></svg>登录</button>
      <button class="{{chip_totp}}" aria-pressed="{{pressed_totp}}" onClick="{{pick_totp}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>验证码</button>
      <button class="{{chip_card}}" aria-pressed="{{pressed_card}}" onClick="{{pick_card}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5.5" width="18" height="13" rx="2.5"/><path d="M3 10h18"/></svg>银行卡</button>
      <button class="{{chip_identity}}" aria-pressed="{{pressed_identity}}" onClick="{{pick_identity}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2.5"/><circle cx="9" cy="11" r="2.2"/><path d="M14.5 10h3.5M14.5 13.5h3.5"/></svg>身份</button>
      <button class="{{chip_note}}" aria-pressed="{{pressed_note}}" onClick="{{pick_note}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M9 13h7M9 16.5h5"/></svg>安全笔记</button>
      <button class="{{chip_ssh}}" aria-pressed="{{pressed_ssh}}" onClick="{{pick_ssh}}"><svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg>SSH 密钥</button>
    </div>

    <div class="hdr" style="padding: 24px 20px 10px">{{resultTitle}}</div>
    <sc-if value="{{hasResults}}" hint-placeholder-val="{{ true }}">
      <div class="grp" style="margin: 0 16px; --inset: 64px">
        <sc-for list="{{results}}" as="it" hint-placeholder-count="3">
          <a href="iPhone-Item.dc.html" class="row" style="min-height: 60px">
            <span class="bt" style="width: 36px; height: 36px; font-size: 17px; background: {{it.bg}}; color: {{it.fg}}">{{it.glyph}}</span>
            <span class="grow"><span class="bd ell" style="display: block">{{it.name}}</span><span class="sh s2 ell" style="display: block">{{it.sub}}</span></span>
            <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
          </a>
        </sc-for>
      </div>
    </sc-if>
    <sc-if value="{{noResults}}" hint-placeholder-val="{{ false }}">
      <div style="display: flex; flex-direction: column; align-items: center; text-align: center; padding: 40px 40px 0; gap: 8px">
        <svg class="ic xl s2" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <div class="t3">没有结果</div>
        <div class="sh s2">没有条目的名称、用户名或网站包含“{{q}}”。</div>
      </div>
    </sc-if>
  </div>

  <div class="edgefade"></div>

  <div style="position: absolute; left: 0; right: 0; top: 62px; height: 52px; padding: 0 16px; display: flex; align-items: center; gap: 10px; z-index: 6">
    <label class="glass" style="flex: 1; height: 44px; border-radius: 999px; display: flex; align-items: center; gap: 8px; padding: 0 4px 0 14px; color: var(--label2)">
      <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
      <input class="field" type="search" placeholder="名称、用户名或网站" aria-label="搜索保险库" value="{{q}}" onInput="{{onQuery}}">
      <button aria-label="清除搜索" onClick="{{clear}}" style="width: 36px; height: 36px; border: 0; background: none; padding: 0; display: grid; place-items: center; color: var(--label3)"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.2 9.2l5.6 5.6M14.8 9.2l-5.6 5.6"/></svg></button>
    </label>
    <a href="Main.dc.html" class="gtext glass">取消</a>
  </div>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabs glass">
      <a href="Main.dc.html" class="tab on" aria-current="page">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.6l7.6 3v5.6c0 5-3.2 8.6-7.6 10.4-4.4-1.8-7.6-5.4-7.6-10.4V5.6z M12 8.2a2.2 2.2 0 0 0-1.1 4.1V15a1.1 1.1 0 0 0 2.2 0v-2.7A2.2 2.2 0 0 0 12 8.2z"/></svg>保险库
      </a>
      <a href="iPhone-Codes.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z M11.1 7v5.6l3.9 2.4.9-1.5-3.1-1.9V7z"/></svg>验证码
      </a>
      <a href="iPhone-Send.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 2.7L3 9.9c-.9.4-.9 1.6 0 2l7.1 2.9 2.9 7.1c.4.9 1.6.9 2 0z"/></svg>Send
      </a>
      <a href="iPhone-Generator.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.1 6.1 6.1 2.1-6.1 2.1L12 19l-2.1-6.2-6.1-2.1 6.1-2.1z"/><path d="M19 15.2l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>生成器
      </a>
    </div>
    <a href="iPhone-Settings.dc.html" class="tabsearch glass" aria-label="账户与设置">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--gray); color: var(--on-fill); display: grid; place-items: center; font-size: 15px; font-weight: 600; ">LC</span>
    </a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { q: 'g', type: '' };
    this.items = [
      { name: 'Apple 账户', tags: 'login', sub: 'lin.chen@example.com', bg: '#6C6C72', fg: '#fff', glyph: 'A' },
      { name: 'Dropbox', tags: 'login totp', sub: 'lin.chen@example.com', bg: '#0061FF', fg: '#fff', glyph: 'D' },
      { name: 'GitHub', tags: 'login totp', sub: 'linchen-dev', bg: '#1B1F23', fg: '#fff', glyph: 'G' },
      { name: 'GitHub 恢复码', tags: 'note', sub: '安全笔记', bg: 'var(--orange)', fg: 'var(--on-fill)', glyph: '笔' },
      { name: 'GitLab', tags: 'login totp', sub: 'linchen', bg: '#C2410C', fg: '#fff', glyph: 'G' },
      { name: 'Google', tags: 'login totp', sub: 'lin.chen@example.com', bg: '#3A78E0', fg: '#fff', glyph: 'G' },
      { name: 'Microsoft', tags: 'login totp', sub: 'lin.chen@example.com', bg: '#0067B8', fg: '#fff', glyph: 'M' },
      { name: 'Netflix', tags: 'login', sub: '家庭账户', bg: '#141414', fg: '#FF4D55', glyph: 'N' },
      { name: '部署服务器', tags: 'ssh', sub: 'SSH 密钥 · ed25519', bg: 'var(--gray)', fg: 'var(--on-fill)', glyph: '>' },
      { name: '工资卡', tags: 'card', sub: 'Visa •••• 4021', bg: 'var(--indigo)', fg: 'var(--on-fill)', glyph: '卡' },
      { name: '护照', tags: 'identity', sub: '身份 · 陈林', bg: 'var(--purple)', fg: 'var(--on-fill)', glyph: '护' },
      { name: '家庭 Wi‑Fi', tags: 'note', sub: '安全笔记', bg: 'var(--cyan)', fg: 'var(--on-fill)', glyph: 'W' },
      { name: '驾驶证', tags: 'identity', sub: '身份 · 陈林', bg: 'var(--purple)', fg: 'var(--on-fill)', glyph: '驾' },
      { name: '微信', tags: 'login', sub: 'linchen_wx', bg: '#07A35A', fg: '#fff', glyph: '微' },
      { name: '信用卡', tags: 'card', sub: 'Mastercard •••• 7710', bg: 'var(--indigo)', fg: 'var(--on-fill)', glyph: '卡' },
      { name: '支付宝', tags: 'login', sub: '138****2046', bg: '#1668E3', fg: '#fff', glyph: '支' }
    ];
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const q = this.state.q;
    const needle = q.trim().toLowerCase();
    const t = this.state.type;
    const results = this.items.filter((it) => (!t || it.tags.split(' ').indexOf(t) >= 0) && (!needle || (it.name + ' ' + it.sub).toLowerCase().includes(needle)));
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      chip_login: t === 'login' ? 'chip on' : 'chip', pressed_login: t === 'login' ? 'true' : 'false', pick_login: () => this.setState({ type: t === 'login' ? '' : 'login' }),
      chip_totp: t === 'totp' ? 'chip on' : 'chip', pressed_totp: t === 'totp' ? 'true' : 'false', pick_totp: () => this.setState({ type: t === 'totp' ? '' : 'totp' }),
      chip_card: t === 'card' ? 'chip on' : 'chip', pressed_card: t === 'card' ? 'true' : 'false', pick_card: () => this.setState({ type: t === 'card' ? '' : 'card' }),
      chip_identity: t === 'identity' ? 'chip on' : 'chip', pressed_identity: t === 'identity' ? 'true' : 'false', pick_identity: () => this.setState({ type: t === 'identity' ? '' : 'identity' }),
      chip_note: t === 'note' ? 'chip on' : 'chip', pressed_note: t === 'note' ? 'true' : 'false', pick_note: () => this.setState({ type: t === 'note' ? '' : 'note' }),
      chip_ssh: t === 'ssh' ? 'chip on' : 'chip', pressed_ssh: t === 'ssh' ? 'true' : 'false', pick_ssh: () => this.setState({ type: t === 'ssh' ? '' : 'ssh' }),
      q: q,
      results: results,
      hasResults: results.length > 0,
      noResults: results.length === 0,
      resultTitle: (needle || t) ? results.length + ' 个结果' : '全部条目',
      onQuery: (e) => this.setState({ q: e.target.value }),
      clear: () => this.setState({ q: '' })
    };
  }
}
</script>
</body>
</html>
