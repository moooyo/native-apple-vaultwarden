<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>自动填充 · iPhone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 402px; height: 874px; background: var(--card)">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 48px; z-index: 40; pointer-events: none; color: var(--label)">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -.4px">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z"/></svg><svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill: none; stroke: currentColor; opacity: .4"/><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" style="fill: currentColor; opacity: .4"/></svg></span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: black; z-index: 40; pointer-events: none"></div>


  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; padding: 92px 28px 0">
    <div class="hl">Example 论坛</div>
    <div class="t1" style="margin-top: 36px">登录到你的账户</div>
    <div class="fn s2" style="margin: 26px 0 6px">邮箱或用户名</div>
    <div style="height: 48px; border-radius: 12px; border: {{userBorder}}; display: flex; align-items: center; padding: 0 14px; background: {{filledBg}}">{{userText}}</div>
    <div class="fn s2" style="margin: 18px 0 6px">密码</div>
    <div style="height: 48px; border-radius: 12px; border: 1px solid var(--sep); display: flex; align-items: center; padding: 0 14px; letter-spacing: 2px; background: {{filledBg}}">{{pwText}}</div>
    <div style="height: 48px; border-radius: 12px; background: var(--label); margin-top: 24px"></div>
  </div>
  <sc-if value="{{open}}" hint-placeholder-val="{{ true }}">
  <div class="dimmer"></div>

  <section class="sheet float" aria-label="OpenVault 自动填充" style="padding-bottom: 20px">
    <div class="grab"></div>
    <div style="display: flex; align-items: flex-start; gap: 12px; padding: 10px 16px 0 20px">
      <div style="flex: 1; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px">
          <span style="width: 22px; height: 22px; border-radius: 6px; background: linear-gradient(#4C5E82, #2E3B55); display: grid; place-items: center; flex: none">
            <svg viewBox="0 0 1024 1024" width="16" height="16" aria-hidden="true"><path fill="rgba(255,255,255,.92)" d="M504 219a23 23 0 0 1 16 0l206 79a23 23 0 0 1 15 21v154c0 169-90 290-220 344a23 23 0 0 1-18 0c-130-54-220-175-220-344V319a23 23 0 0 1 15-21z"/><path fill="#2E3B55" d="M490 515a49 49 0 1 1 44 0v81a22 22 0 0 1-44 0z"/></svg>
          </span>
          <span class="fn s2" style="font-weight: 600">OpenVault</span>
        </div>
        <h1 class="t3 m" style="margin-top: 8px">选择用于 forum.example.com 的凭据</h1>
      </div>
      <button class="gbtn glass" aria-label="关闭" onClick="{{dismiss}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
    </div>

    <div class="grp" style="margin: 18px 16px 0; background: var(--card); --inset: 68px">
      <button class="row" onClick="{{pickA}}" style="width: 100%; border: 0; background: none; text-align: left; min-height: 66px">
        <span class="bt" style="width: 40px; height: 40px; background: #0B7A75; font-size: 18px">E</span>
        <span class="grow"><span class="bd ell" style="display: block; font-weight: 600">lin.chen</span><span class="sh s2 ell" style="display: block">Example 论坛 · 密码</span></span>
        <span class="badge">最近使用</span>
      </button>
      <button class="row" onClick="{{pickPk}}" style="width: 100%; border: 0; background: none; text-align: left; min-height: 66px">
        <span class="bt" style="width: 40px; height: 40px; background: var(--fill); color: var(--tint)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="8.5" r="3.5"/><path d="M3 20c.6-3.3 3-5.3 6-5.3 1.3 0 2.5.4 3.4 1"/><circle cx="17" cy="14" r="2.3"/><path d="M17 16.3V21M17 19h1.8"/></svg></span>
        <span class="grow"><span class="bd ell" style="display: block; font-weight: 600">lin.chen</span><span class="sh s2 ell" style="display: block">通行密钥</span></span>
      </button>
      <button class="row" onClick="{{pickB}}" style="width: 100%; border: 0; background: none; text-align: left; min-height: 66px">
        <span class="bt" style="width: 40px; height: 40px; background: #0B7A75; font-size: 18px">E</span>
        <span class="grow"><span class="bd ell" style="display: block; font-weight: 600">qa-tester</span><span class="sh s2 ell" style="display: block">测试账号 · 密码与验证码</span></span>
      </button>
      <a href="iPhone-Search.dc.html" class="row tint" style="min-height: 52px">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="margin: 0 9px"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
        <span class="bd">搜索其他凭据</span>
      </a>
    </div>
  </section>
  </sc-if>
  <sc-if value="{{closed}}" hint-placeholder-val="{{ false }}">
    <button class="gtext glass" onClick="{{reopen}}" style="position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%)">再次打开自动填充</button>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { open: true, filled: '' };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const fill = (u) => () => this.setState({ open: false, filled: u });
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      open: s.open, closed: !s.open,
      dismiss: () => this.setState({ open: false, filled: '' }),
      reopen: () => this.setState({ open: true, filled: '' }),
      pickA: fill('lin.chen'), pickB: fill('qa-tester'), pickPk: fill('passkey'),
      userText: s.filled === 'passkey' ? '已使用通行密钥登录' : s.filled,
      pwText: s.filled && s.filled !== 'passkey' ? '••••••••••••' : '',
      userBorder: s.open ? '2px solid var(--accent)' : '1px solid var(--sep)',
      filledBg: s.filled ? 'color-mix(in srgb, var(--yellow) 18%, var(--card))' : 'transparent'
    };
  }
}
</script>
</body>
</html>
