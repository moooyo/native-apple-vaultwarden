<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>生成器 · Mac</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 1280px; height: 800px; background: var(--window); letter-spacing: -.08px">

  <main style="position: absolute; left: 248px; right: {{mainRight}}px; top: 0; bottom: 0; background: var(--window); padding: 84px 0 0">
    <div style="width: 560px; margin: 0 auto">
      <div class="seg" role="tablist" aria-label="生成类型" style="width: 320px; margin: 0 auto">
        <sc-for list="{{modes}}" as="m" hint-placeholder-count="3">
          <button class="{{m.cls}}" role="tab" aria-selected="{{m.sel}}" onClick="{{m.pick}}" style="height: 26px; font-size: 13px">{{m.label}}</button>
        </sc-for>
      </div>

      <div style="margin-top: 22px; border-radius: 10px; background: var(--mgrp); box-shadow: 0 0 0 .5px var(--sep); padding: 22px 22px 18px">
        <div class="mono" aria-live="polite" style="font-size: 24px; line-height: 32px; font-weight: 600; word-break: break-all; min-height: 64px; text-align: center"><sc-for list="{{chars}}" as="ch" hint-placeholder-count="20"><span style="color: {{ch.color}}">{{ch.c}}</span></sc-for></div>
        <div style="display: flex; align-items: center; gap: 10px; margin-top: 14px">
          <div style="display: flex; gap: 4px; flex: 1" aria-hidden="true">
            <sc-for list="{{segments}}" as="sg" hint-placeholder-count="4"><span style="flex: 1; height: 4px; border-radius: 2px; background: {{sg.bg}}"></span></sc-for>
          </div>
          <span style="font-size: 12px; font-weight: 600; color: var(--label2)">{{levelText}}</span>
        </div>
      </div>

      <div style="display: flex; justify-content: center; gap: 10px; margin-top: 14px">
        <button class="mbtn" onClick="{{regen}}"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.5 12a7.5 7.5 0 1 1-2.2-5.3"/><path d="M19.5 4.5v4h-4"/></svg>重新生成</button>
        <button class="mbtn def" onClick="{{copy}}" style="min-width: 96px; justify-content: center"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{copyIcon}}"/></svg>{{copyText}}</button>
      </div>

      <div style="margin-top: 24px; border-radius: 10px; background: var(--mgrp); box-shadow: 0 0 0 .5px var(--sep)">
        <sc-if value="{{isPassword}}" hint-placeholder-val="{{ true }}">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; font-size: 13px">
            <label for="mac-len" style="width: 120px">长度</label>
            <input id="mac-len" type="range" min="8" max="64" value="{{length}}" onChange="{{onLength}}" style="flex: 1; accent-color: var(--accent); margin: 0">
            <span class="mfield mono" style="width: 44px; justify-content: center">{{length}}</span>
          </div>
          <sc-for list="{{toggles}}" as="t" hint-placeholder-count="5">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 14px; font-size: 13px; border-top: .5px solid var(--sep)">
              <button class="{{t.cls}}" role="checkbox" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.flip}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
              <span style="flex: 1">{{t.label}}</span>
              <span class="mono" style="font-size: 12px; color: var(--label2)">{{t.hint}}</span>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{isPhrase}}" hint-placeholder-val="{{ false }}">
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; font-size: 13px">
            <span style="flex: 1">单词数量</span>
            <div class="mstep"><span class="num mono">{{words}}</span><span class="stp"><button aria-label="增加单词" onClick="{{more}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button aria-label="减少单词" onClick="{{fewer}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span></div>
          </div>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; font-size: 13px; border-top: .5px solid var(--sep)">
            <span style="flex: 1">分隔符</span>
            <div class="seg" style="width: 220px"><sc-for list="{{seps}}" as="sp" hint-placeholder-count="4"><button class="{{sp.cls}}" onClick="{{sp.pick}}" style="height: 22px; font-size: 12px">{{sp.label}}</button></sc-for></div>
          </div>
          <sc-for list="{{phraseToggles}}" as="t" hint-placeholder-count="2">
            <div style="display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 0 14px; font-size: 13px; border-top: .5px solid var(--sep)">
              <button class="{{t.cls}}" role="checkbox" aria-checked="{{t.checked}}" aria-label="{{t.label}}" onClick="{{t.flip}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></button>
              <span style="flex: 1">{{t.label}}</span>
            </div>
          </sc-for>
        </sc-if>
        <sc-if value="{{isUser}}" hint-placeholder-val="{{ false }}">
          <label class="mfrow top" style="min-height: 44px"><span>别名前缀</span><input class="val" value="linchen" aria-label="别名前缀"></label>
          <label class="mfrow" style="min-height: 44px"><span>域名</span><input class="val" value="example.com" aria-label="域名"></label>
          <div style="display: flex; align-items: center; gap: 12px; min-height: 44px; padding: 0 14px; font-size: 13px; border-top: .5px solid var(--sep)">
            <span style="flex: 1">随机后缀</span>
            <div class="mstep"><span class="num mono">{{suffix}} 位</span><span class="stp"><button aria-label="加长后缀" onClick="{{longer}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 15l6-6 6 6"/></svg></button><button aria-label="缩短后缀" onClick="{{shorter}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></button></span></div>
          </div>
        </sc-if>
      </div>
    </div>

  </main>

  <sc-if value="{{showHist}}" hint-placeholder-val="{{ true }}">
  <aside aria-label="生成历史" style="position: absolute; right: 0; top: 0; bottom: 0; width: 300px; background: var(--window); border-left: .5px solid var(--sep); padding: 76px 12px 0">
    <div style="display: flex; align-items: center; padding: 0 8px 8px">
      <span style="font-size: 13px; font-weight: 700; flex: 1">生成历史</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 2px">
      <sc-for list="{{history}}" as="h" hint-placeholder-count="6">
        <button class="hrow" onClick="{{h.copy}}" aria-label="{{h.copyLabel}}">
          <span style="flex: 1; min-width: 0"><span class="mono ell" style="display: block; font-size: 12px">{{h.value}}</span><span style="display: block; font-size: 11px; color: var(--label2)">{{h.meta}}</span></span>
          <span class="{{h.hintCls}}" aria-hidden="true"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="{{h.hintIcon}}"/></svg>{{h.hintText}}</span>
        </button>
      </sc-for>
    </div>
  </aside>
  </sc-if>

  <aside class="mside" aria-label="侧边栏">
    <div class="lights" aria-hidden="true" style="padding-left: 8px"><i style="background: #FF5F57"></i><i style="background: #FEBC2E"></i><i style="background: #28C840"></i></div>
    <nav style="display: flex; flex-direction: column; gap: 1px; margin-top: 22px">
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM15 4h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM6 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2zM15 13h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2h-3a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2z"/></svg>全部条目<span class="cnt">16</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="color: var(--orange)"><path d="M12 3.5l2.6 5.3 5.9.9-4.3 4.1 1 5.8L12 16.9l-5.2 2.7 1-5.8L3.5 9.7l5.9-.9z"/></svg>置顶<span class="cnt">4</span></a>
      <a href="Mac-Codes.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.5a8.5 8.5 0 1 1 0 17 8.5 8.5 0 0 1 0-17zM12 7.5V12l3 2"/></svg>验证码<span class="cnt">5</span></a>
      <div class="mhdr">类型</div>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 19a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM10.8 12.2L20 3M16 7l3 3M14 9l2 2"/></svg>登录<span class="cnt">9</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5.5h13a2.5 2.5 0 0 1 2.5 2.5v8a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16V8a2.5 2.5 0 0 1 2.5-2.5zM3 10h18M7 15h3"/></svg>银行卡<span class="cnt">2</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 5h13A2.5 2.5 0 0 1 21 7.5v9a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 16.5v-9A2.5 2.5 0 0 1 5.5 5zM9 13.2a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4zM14.5 10h3.5M14.5 13.5h3.5"/></svg>身份<span class="cnt">2</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6zM14 3.5V8.5h5M9 13h7M9 16.5h5"/></svg>安全笔记<span class="cnt">2</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.5 4.5h13A2.5 2.5 0 0 1 21 7v10a2.5 2.5 0 0 1-2.5 2.5h-13A2.5 2.5 0 0 1 3 17V7a2.5 2.5 0 0 1 2.5-2.5zM7 9.5l3 2.5-3 2.5M12.5 15h4.5"/></svg>SSH 密钥<span class="cnt">1</span></a>
      <div class="mhdr">文件夹<a href="Mac-Vault.dc.html" class="mhadd" aria-label="新建文件夹"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12"/></svg></a></div>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>工作<span class="cnt">6</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>个人<span class="cnt">5</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/></svg>金融<span class="cnt">3</span></a>
      <a href="Mac-Vault.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 13.5l2.5-7h11l2.5 7v4.5a1.5 1.5 0 0 1-1.5 1.5h-13A1.5 1.5 0 0 1 4 18zM4 13.5h4.5l1 2h5l1-2H20"/></svg>无文件夹<span class="cnt">2</span></a>
      <div class="mhdr">工具</div>
      <a href="Mac-Send.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 3.5L10.2 13.8M20.5 3.5l-6.3 17-4-6.7-6.7-4z"/></svg>Send<span class="cnt">3</span></a>
      <a href="Mac-Generator.dc.html" class="mrow on" aria-current="page"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg>生成器</a>
      <div class="mhdr">隐藏的条目</div>
      <a href="Mac-Trash.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 4.5h17v4.5h-17zM5 9v9.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V9M10 13h4"/></svg>归档<span class="cnt">1</span></a>
      <a href="Mac-Trash.dc.html" class="mrow"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 7h15M9.5 7V4.5h5V7M6.5 7l1 13h9l1-13"/></svg>回收站<span class="cnt">2</span></a>
    </nav>
  </aside>

  <header style="position: absolute; left: 248px; right: 0; top: 0; height: 60px; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 16px; z-index: 3">
    <div style="flex: 1">
      <div class="mt3">生成器</div>
    </div>
    <button class="gbtn glass" aria-label="{{histLabel}}" aria-pressed="{{histPressed}}" onClick="{{toggleHist}}" style="width: 36px; height: 36px"><svg class="ic s" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M14.5 4.5v15"/></svg></button>
  </header>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.words = ['orbit', 'maple', 'thunder', 'velvet', 'harbor', 'pixel', 'quartz', 'lantern', 'meadow', 'copper', 'sparrow', 'tundra', 'glacier', 'ember', 'nimbus', 'cedar', 'falcon', 'saffron', 'willow', 'canyon'];
    const base = { mode: 'password', length: 20, upper: true, lower: true, digits: true, symbols: true, avoid: false, words: 4, sep: '-', cap: true, num: true, suffix: 4, copied: '', showHist: true };
    base.value = this.make(base);
    base.history = [
      { value: 'Velvet-Harbor-Quartz7-Ember', meta: '口令 · 2 分钟前' },
      { value: 'p9X!wq2-Rk7m#Tz4nLe8', meta: '密码 · 12 分钟前' },
      { value: 'linchen.k7x2@example.com', meta: '用户名 · 昨天' },
      { value: 'G4u$e9Tqm2-Lw7Vz!c8R', meta: '密码 · 昨天' }
    ];
    this.state = base;
  }
  rnd(n) {
    if (window.crypto && window.crypto.getRandomValues) {
      const a = new Uint32Array(1);
      window.crypto.getRandomValues(a);
      return a[0] % n;
    }
    return Math.floor(Math.random() * n);
  }
  make(s) {
    if (s.mode === 'password') {
      const sets = [];
      if (s.upper) sets.push(s.avoid ? 'ABCDEFGHJKLMNPQRSTUVWXYZ' : 'ABCDEFGHIJKLMNOPQRSTUVWXYZ');
      if (s.lower) sets.push(s.avoid ? 'abcdefghijkmnopqrstuvwxyz' : 'abcdefghijklmnopqrstuvwxyz');
      if (s.digits) sets.push(s.avoid ? '23456789' : '0123456789');
      if (s.symbols) sets.push('!@#$%^&*-_+=?');
      if (!sets.length) sets.push('abcdefghijklmnopqrstuvwxyz');
      const pool = sets.join('');
      const out = sets.map((set) => set[this.rnd(set.length)]);
      while (out.length < s.length) out.push(pool[this.rnd(pool.length)]);
      for (let i = out.length - 1; i > 0; i--) { const j = this.rnd(i + 1); const t = out[i]; out[i] = out[j]; out[j] = t; }
      return out.join('');
    }
    if (s.mode === 'passphrase') {
      const list = [];
      for (let i = 0; i < s.words; i++) {
        let w = this.words[this.rnd(this.words.length)];
        if (s.cap) w = w[0].toUpperCase() + w.slice(1);
        list.push(w);
      }
      if (s.num) { const k = this.rnd(list.length); list[k] = list[k] + this.rnd(10); }
      return list.join(s.sep);
    }
    const A = 'abcdefghjkmnpqrstuvwxyz23456789';
    let suf = '';
    for (let i = 0; i < s.suffix; i++) suf += A[this.rnd(A.length)];
    return 'linchen.' + suf + '@example.com';
  }
  update(patch) {
    const next = Object.assign({}, this.state, patch);
    next.value = this.make(next);
    next.copied = '';
    this.setState(next);
  }
  bits(s) {
    if (s.mode === 'password') {
      let pool = 0;
      if (s.upper) pool += s.avoid ? 24 : 26;
      if (s.lower) pool += s.avoid ? 25 : 26;
      if (s.digits) pool += s.avoid ? 8 : 10;
      if (s.symbols) pool += 13;
      return s.length * Math.log2(Math.max(pool, 26));
    }
    if (s.mode === 'passphrase') return s.words * 12.9 + (s.num ? 3.3 : 0);
    return s.suffix * 4.9;
  }
  componentWillUnmount() {
    clearTimeout(this.copyTimer);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const bits = this.bits(s);
    const level = bits < 40 ? 1 : bits < 60 ? 2 : bits < 90 ? 3 : 4;
    const levelColor = level <= 2 ? 'var(--warn)' : 'var(--ok)';
    const modeNames = { password: '密码', passphrase: '口令', username: '用户名' };
    const flip = (key) => () => {
      const next = Object.assign({}, s, { [key]: !s[key] });
      if (s.mode === 'password' && !next.upper && !next.lower && !next.digits && !next.symbols) return;
      this.update({ [key]: !s[key] });
    };
    const tog = (key, label, hint) => ({ label: label, hint: hint, cls: s[key] ? 'cb' : 'cb off', checked: s[key] ? 'true' : 'false', flip: flip(key) });
    const flash = (key, extra) => { clearTimeout(this.copyTimer); this.setState(Object.assign({ copied: key }, extra || {})); this.copyTimer = setTimeout(() => this.setState({ copied: '' }), 1600); };
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ' mac' + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      modes: ['password', 'passphrase', 'username'].map((m) => ({ label: modeNames[m], cls: s.mode === m ? 'on' : '', sel: s.mode === m ? 'true' : 'false', pick: () => this.update({ mode: m }) })),
      chars: s.value.split('').map((c) => ({ c: c, color: /[0-9]/.test(c) ? 'var(--digit)' : /[A-Za-z]/.test(c) ? 'var(--label)' : 'var(--sym)' })),
      segments: [1, 2, 3, 4].map((i) => ({ bg: s.mode === 'username' ? 'var(--fill2)' : (i <= level ? levelColor : 'var(--fill2)') })),
      levelColor: s.mode === 'username' ? 'var(--label2)' : levelColor,
      levelText: s.mode === 'username' ? '用于注册时隐藏真实邮箱' : (['', '弱', '中等', '强', '极强'][level] + ' · 约 ' + Math.round(bits) + ' 位熵'),
      regen: () => this.update({}),
      showHist: s.showHist, mainRight: s.showHist ? 300 : 0,
      histLabel: s.showHist ? '隐藏生成历史' : '显示生成历史', histPressed: s.showHist ? 'true' : 'false',
      toggleHist: () => this.setState({ showHist: !s.showHist }),
      copy: () => flash('main', { history: [{ value: s.value, meta: modeNames[s.mode] + ' · 刚刚' }].concat(s.history).slice(0, 8) }),
      copyText: s.copied === 'main' ? '已拷贝' : '拷贝',
      copyIcon: s.copied === 'main' ? 'M5 12.5l4.5 4.5L19 7.5' : 'M9 9h10.5v11.5H9zM15 9V4.5H4.5V15H9',
      history: s.history.map((h, i) => ({
        value: h.value, meta: h.meta, copy: () => flash('h' + i), copyLabel: '拷贝 ' + h.value,
        hintCls: s.copied === 'h' + i ? 'fcopy done' : 'fcopy', hintIcon: s.copied === 'h' + i ? 'M5 12.5l4.5 4.5L19 7.5' : 'M9 9h10.5v11.5H9zM15 9V4.5H4.5V15H9', hintText: s.copied === 'h' + i ? '已拷贝' : ''
      })),
      isPassword: s.mode === 'password',
      isPhrase: s.mode === 'passphrase',
      isUser: s.mode === 'username',
      length: s.length,
      onLength: (e) => this.update({ length: parseInt(e.target.value, 10) }),
      toggles: [tog('upper', '大写字母', 'A–Z'), tog('lower', '小写字母', 'a–z'), tog('digits', '数字', '0–9'), tog('symbols', '符号', '!@#$%'), tog('avoid', '避开易混淆字符', 'l 1 O 0')],
      words: s.words,
      fewer: () => this.update({ words: Math.max(3, s.words - 1) }),
      more: () => this.update({ words: Math.min(10, s.words + 1) }),
      seps: [['-', '-'], [' ', '空格'], ['.', '.'], ['_', '_']].map((p) => ({ label: p[1], cls: s.sep === p[0] ? 'on' : '', pick: () => this.update({ sep: p[0] }) })),
      phraseToggles: [tog('cap', '首字母大写', ''), tog('num', '包含数字', '')],
      suffix: s.suffix,
      shorter: () => this.update({ suffix: Math.max(2, s.suffix - 1) }),
      longer: () => this.update({ suffix: Math.min(10, s.suffix + 1) })
    };
  }
}
</script>
