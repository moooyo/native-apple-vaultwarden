<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文件夹 · iPhone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 402px; height: 874px">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 48px; z-index: 40; pointer-events: none; color: var(--label)">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -.4px">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z"/></svg><svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill: none; stroke: currentColor; opacity: .4"/><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" style="fill: currentColor; opacity: .4"/></svg></span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: black; z-index: 40; pointer-events: none"></div>

  <div class="topbar">
    <a href="Main.dc.html" class="gbtn glass" aria-label="返回保险库"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg></a>
    <div style="flex: 1"></div>
    <div class="gcap glass">
      <button aria-label="文件夹操作" onClick="{{toggleMenu}}" aria-haspopup="menu" aria-expanded="{{menuExpanded}}"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/></svg></button>
      <a href="iPhone-NewItem.dc.html" aria-label="在此文件夹新建条目"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></a>
    </div>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 116px; bottom: 0">
    <div style="padding: 4px 20px 0">
      <h1 class="lt m">{{name}}</h1>
    </div>
    <div class="grp" style="margin: 18px 16px 0; --inset: 64px">
      <sc-for list="{{rows}}" as="it" hint-placeholder-count="8">
        <a href="iPhone-Item.dc.html" class="row" style="min-height: 60px">
          <span class="bt" style="width: 36px; height: 36px; font-size: 17px; background: {{it.bg}}; color: {{it.fg}}">{{it.glyph}}</span>
          <span class="grow"><span class="bd ell" style="display: block">{{it.name}}</span><span class="sh s2 ell" style="display: block">{{it.sub}}</span></span>
          <svg class="ic s chev" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>
        </a>
      </sc-for>
    </div>
  </div>
  <div class="edgefade"></div>

  <nav class="tabbar" aria-label="主导航">
    <div class="tabs glass">
      <a href="Main.dc.html" class="tab on" aria-current="page">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.6l7.6 3v5.6c0 5-3.2 8.6-7.6 10.4-4.4-1.8-7.6-5.4-7.6-10.4V5.6z M12 8.2a2.2 2.2 0 0 0-1.1 4.1V15a1.1 1.1 0 0 0 2.2 0v-2.7A2.2 2.2 0 0 0 12 8.2z"/></svg>保险库
      </a>
      <a href="iPhone-Codes.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path class="eo" d="M12 2.8a9.2 9.2 0 1 1 0 18.4 9.2 9.2 0 0 1 0-18.4z M11.1 7v5.6l3.9 2.4.9-1.5-3.1-1.9V7z"/></svg>验证码
      </a>
      <a href="iPhone-Send.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.3 2.7L3 9.9c-.9.4-.9 1.6 0 2l7.1 2.9 2.9 7.1c.4.9 1.6.9 2 0z"/></svg>Send
      </a>
      <a href="iPhone-Generator.dc.html" class="tab">
        <svg class="ic fi" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.1 6.1 6.1 2.1-6.1 2.1L12 19l-2.1-6.2-6.1-2.1 6.1-2.1z"/><path d="M19 15.2l.8 2 2 .8-2 .8-.8 2-.8-2-2-.8 2-.8z"/></svg>生成器
      </a>
    </div>
    <a href="iPhone-Settings.dc.html" class="tabsearch glass" aria-label="账户与设置">
      <span style="width: 40px; height: 40px; border-radius: 50%; background: var(--gray); color: var(--on-fill); display: grid; place-items: center; font-size: 15px; font-weight: 600; ">LC</span>
    </a>
  </nav>

  <sc-if value="{{menuOpen}}" hint-placeholder-val="{{ false }}">
    <button onClick="{{closeAll}}" aria-label="关闭菜单" tabindex="-1" style="position: absolute; inset: 0; z-index: 9; border: 0; background: none; padding: 0"></button>
    <div class="glass" role="menu" aria-label="文件夹操作" style="position: absolute; right: 16px; top: 108px; width: 230px; z-index: 10; border-radius: 22px; padding: 6px">
      <button role="menuitem" onClick="{{askRename}}" style="width: 100%; height: 44px; border: 0; background: none; border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 17px; text-align: left; color: var(--label)">重命名…</button>
      <button role="menuitem" onClick="{{askDelete}}" style="width: 100%; height: 44px; border: 0; background: none; border-radius: 16px; display: flex; align-items: center; gap: 10px; padding: 0 14px; font-size: 17px; text-align: left; color: var(--danger)">删除文件夹…</button>
    </div>
  </sc-if>

  <sc-if value="{{renaming}}" hint-placeholder-val="{{ false }}">
    <div class="dimmer" style="z-index: 10"></div>
    <div class="glass" role="alertdialog" aria-label="重命名文件夹" style="position: absolute; left: 50%; top: 300px; transform: translateX(-50%); width: 300px; z-index: 11; border-radius: 30px; padding: 20px 16px 14px; text-align: center">
      <div class="hl">重命名文件夹</div>
      <input class="field" value="{{draft}}" onInput="{{onDraft}}" aria-label="文件夹名称" style="margin-top: 14px; height: 40px; border-radius: 12px; background: var(--card); box-shadow: 0 0 0 .5px var(--sep); padding: 0 12px; font-size: 17px; text-align: left">
      <div style="display: flex; gap: 8px; margin-top: 14px">
        <button class="bfill" onClick="{{closeAll}}" style="flex: 1; height: 44px">取消</button>
        <button class="bp solid" onClick="{{saveName}}" style="flex: 1; height: 44px">存储</button>
      </div>
    </div>
  </sc-if>

  <sc-if value="{{deleting}}" hint-placeholder-val="{{ false }}">
    <div class="dimmer" style="z-index: 10"></div>
    <div class="glass" role="alertdialog" aria-label="删除文件夹" style="position: absolute; left: 50%; top: 300px; transform: translateX(-50%); width: 300px; z-index: 11; border-radius: 30px; padding: 20px 16px 14px; text-align: center">
      <div class="hl">删除“{{name}}”？</div>
      <div class="fn s2" style="margin-top: 6px">文件夹里的 6 个条目不会被删除，会移到“无文件夹”。</div>
      <div style="display: flex; gap: 8px; margin-top: 16px">
        <button class="bfill" onClick="{{closeAll}}" style="flex: 1; height: 44px">取消</button>
        <a href="Main.dc.html" class="bp" style="flex: 1; height: 44px; background: var(--danger); color: #fff">删除</a>
      </div>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { name: '工作', draft: '工作', menuOpen: false, renaming: false, deleting: false };
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const rows = [
      ['Dropbox', 'lin.chen@example.com', '#0061FF', 'D'], ['GitHub', 'linchen-dev', '#1B1F23', 'G'], ['GitHub 恢复码', '安全笔记', 'var(--orange)', '笔'],
      ['GitLab', 'linchen', '#C2410C', 'G'], ['Microsoft', 'lin.chen@example.com', '#0067B8', 'M'], ['部署服务器', 'SSH 密钥 · ed25519', 'var(--gray)', '>']
    ];
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      name: s.name,
      rows: rows.map((r) => ({ name: r[0], sub: r[1], bg: r[2], glyph: r[3], fg: r[2].indexOf('var(') === 0 ? 'var(--on-fill)' : '#fff' })),
      menuOpen: s.menuOpen, menuExpanded: s.menuOpen ? 'true' : 'false',
      toggleMenu: () => this.setState({ menuOpen: !s.menuOpen }),
      closeAll: () => this.setState({ menuOpen: false, renaming: false, deleting: false }),
      askRename: () => this.setState({ menuOpen: false, renaming: true, draft: s.name }),
      askDelete: () => this.setState({ menuOpen: false, deleting: true }),
      renaming: s.renaming, deleting: s.deleting,
      draft: s.draft, onDraft: (e) => this.setState({ draft: e.target.value }),
      saveName: () => this.setState({ name: s.draft.trim() || s.name, renaming: false })
    };
  }
}
</script>
</body>
</html>
