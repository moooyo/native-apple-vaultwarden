<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>菜单栏面板 · Mac</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 380px; height: 560px; background: var(--window); letter-spacing: -.08px; display: flex; flex-direction: column; padding: 14px 10px 10px">

  <div style="display: flex; align-items: center; gap: 8px; padding: 0 6px">
    <span style="width: 24px; height: 24px; border-radius: 6px; background: linear-gradient(#4C5E82, #2E3B55); display: grid; place-items: center; flex: none">
      <svg viewBox="0 0 1024 1024" width="18" height="18" aria-hidden="true"><path fill="rgba(255,255,255,.92)" d="M504 219a23 23 0 0 1 16 0l206 79a23 23 0 0 1 15 21v154c0 169-90 290-220 344a23 23 0 0 1-18 0c-130-54-220-175-220-344V319a23 23 0 0 1 15-21z"/><path fill="#2E3B55" d="M490 515a49 49 0 1 1 44 0v81a22 22 0 0 1-44 0z"/></svg>
    </span>
    <span style="font-size: 13px; font-weight: 700; flex: 1">OpenVault</span>
    <span class="c1 s2" style="display: flex; align-items: center; gap: 5px; font-weight: 600"><span style="width: 6px; height: 6px; border-radius: 50%; background: var(--ok)"></span>已解锁</span>
  </div>

  <label style="margin: 12px 0 0; height: 32px; border-radius: 999px; background: var(--fill); display: flex; align-items: center; gap: 6px; padding: 0 12px; color: var(--label2)">
    <svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/></svg>
    <input class="field" placeholder="搜索保险库" aria-label="搜索保险库" style="font-size: 13px" value="{{q}}" onInput="{{onQuery}}">
  </label>

  <div class="mhdr" style="padding: 12px 8px 6px">最近使用</div>
  <div style="display: flex; flex-direction: column; gap: 1px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div class="{{r.cls}}" style="height: 46px; border-radius: 10px; display: flex; align-items: center; gap: 10px; padding: 0 6px 0 8px; background: {{r.bgRow}}">
        <button onClick="{{r.pick}}" aria-label="{{r.name}}" aria-pressed="{{r.pressed}}" style="flex: 1; min-width: 0; border: 0; background: none; padding: 0; display: flex; align-items: center; gap: 10px; text-align: left">
          <span class="bt" style="width: 28px; height: 28px; font-size: 13px; background: {{r.bg}}; color: {{r.fg}}">{{r.glyph}}</span>
          <span style="flex: 1; min-width: 0"><span class="ell" style="display: block; font-size: 13px; font-weight: 600">{{r.name}}</span><span class="ell" style="display: block; font-size: 12px; color: var(--label2)">{{r.sub}}</span></span>
        </button>
        <sc-if value="{{r.on}}" hint-placeholder-val="{{ false }}">
          <button onClick="{{r.copyUser}}" aria-label="拷贝 {{r.name}} 用户名" title="拷贝用户名" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--card); display: grid; place-items: center; color: var(--label)"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.userIcon}}"/></svg></button>
          <button onClick="{{r.copyPw}}" aria-label="拷贝 {{r.name}} 密码" title="拷贝密码" style="width: 30px; height: 30px; border: 0; border-radius: 8px; background: var(--card); display: grid; place-items: center; color: var(--label)"><svg class="ic xs" viewBox="0 0 24 24" aria-hidden="true"><path d="{{r.pwIcon}}"/></svg></button>
          <sc-if value="{{r.hasCode}}" hint-placeholder-val="{{ false }}"><button onClick="{{r.copyCode}}" aria-label="拷贝 {{r.name}} 验证码" title="拷贝验证码" class="mono" style="height: 30px; border: 0; border-radius: 8px; background: var(--card); padding: 0 8px; font-size: 12px; font-weight: 600; color: var(--label)">{{r.codeText}}</button></sc-if>
        </sc-if>
      </div>
    </sc-for>
    <sc-if value="{{noRows}}" hint-placeholder-val="{{ false }}"><div style="padding: 20px 8px; text-align: center; font-size: 13px; color: var(--label2)">没有匹配的条目</div></sc-if>
  </div>

  <div style="margin-top: auto; border-top: .5px solid var(--sep); padding-top: 6px; display: flex; flex-direction: column; gap: 1px">
    <button class="hrow" onClick="{{genCopy}}" style="height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px">
      <svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"/></svg><span style="flex: 1">{{genText}}</span><span class="c1 s2">⌥⌘G</span>
    </button>
    <a href="Mac-Vault.dc.html" class="hrow" style="height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px">
      <svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4.5" width="18" height="15" rx="3"/><path d="M9.5 4.5v15"/></svg><span style="flex: 1">打开 OpenVault</span>
    </a>
    <a href="Mac-Unlock.dc.html" class="hrow" style="height: 30px; padding: 0 8px; border-radius: 8px; font-size: 13px">
      <svg class="ic xs tint" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2.5"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/></svg><span style="flex: 1">锁定保险库</span><span class="c1 s2">⇧⌘L</span>
    </a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":380,"height":560}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sel: 'github', q: '', copied: '' };
    this.items = [
      { id: 'github', name: 'GitHub', sub: 'linchen-dev', bg: '#1B1F23', glyph: 'G', code: '284 019' },
      { id: 'google', name: 'Google', sub: 'lin.chen@example.com', bg: '#3A78E0', glyph: 'G', code: '903 557' },
      { id: 'vw', name: 'Vaultwarden 管理后台', sub: 'admin', bg: '#2E3B55', glyph: 'V' },
      { id: 'ms', name: 'Microsoft', sub: 'lin.chen@example.com', bg: '#0067B8', glyph: 'M', code: '118 640' },
      { id: 'netflix', name: 'Netflix', sub: '家庭账户', bg: '#141414', fg: '#FF4D55', glyph: 'N' },
      { id: 'dropbox', name: 'Dropbox', sub: 'lin.chen@example.com', bg: '#0061FF', glyph: 'D' },
      { id: 'alipay', name: '支付宝', sub: '138****2046', bg: '#1668E3', glyph: '支' }
    ];
  }
  componentWillUnmount() {
    clearTimeout(this.copyTimer);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    const flash = (k) => () => { clearTimeout(this.copyTimer); this.setState({ copied: k }); this.copyTimer = setTimeout(() => this.setState({ copied: '' }), 1600); };
    const needle = s.q.trim().toLowerCase();
    const list = this.items.filter((i) => !needle || (i.name + ' ' + i.sub).toLowerCase().includes(needle));
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ' mac' + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      q: s.q,
      onQuery: (e) => this.setState({ q: e.target.value }),
      noRows: list.length === 0,
      rows: list.map((i) => {
        const on = i.id === s.sel;
        return {
          name: i.name, sub: i.sub, bg: i.bg, fg: i.fg || '#fff', glyph: i.glyph,
          on: on, cls: '', bgRow: on ? 'var(--fill)' : 'transparent', pressed: on ? 'true' : 'false',
          pick: () => this.setState({ sel: i.id, copied: '' }),
          hasCode: !!i.code,
          userIcon: s.copied === i.id + 'u' ? 'M5 12.5l4.5 4.5L19 7.5' : 'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4.5 20a7.5 7.5 0 0 1 15 0',
          pwIcon: s.copied === i.id + 'p' ? 'M5 12.5l4.5 4.5L19 7.5' : 'M8 19a4 4 0 1 1 0-8 4 4 0 0 1 0 8zM10.8 12.2L20 3M16 7l3 3M14 9l2 2',
          codeText: s.copied === i.id + 'c' ? '已拷贝' : (i.code || ''),
          copyUser: flash(i.id + 'u'), copyPw: flash(i.id + 'p'), copyCode: flash(i.id + 'c')
        };
      }),
      genText: s.copied === 'gen' ? '已拷贝新密码' : '生成并拷贝密码',
      genCopy: flash('gen')
    };
  }
}
</script>
</body>
</html>
