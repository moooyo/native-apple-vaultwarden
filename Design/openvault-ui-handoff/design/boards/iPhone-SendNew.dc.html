<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>新建 Send · iPhone</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="../ov-kit.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>body{margin:0}</style>
</helmet>
<div class="{{rootClass}}" style="width: 402px; height: 874px">
  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 0; height: 54px; display: flex; align-items: center; justify-content: space-between; padding: 4px 30px 0 48px; z-index: 40; pointer-events: none; color: var(--label)">
    <span style="font-size: 17px; font-weight: 600; letter-spacing: -.4px">9:41</span>
    <span style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="18" height="12" viewBox="0 0 18 12" style="fill: currentColor"><rect x="0" y="8" width="3" height="4" rx="1"/><rect x="5" y="5.5" width="3" height="6.5" rx="1"/><rect x="10" y="3" width="3" height="9" rx="1"/><rect x="15" y="0" width="3" height="12" rx="1"/></svg><svg aria-hidden="true" width="16" height="12" viewBox="0 0 16 12" style="fill: currentColor"><path d="M8 2.2c2.3 0 4.4.9 6 2.4l1.2-1.2A10.2 10.2 0 0 0 8 .5 10.2 10.2 0 0 0 .8 3.4L2 4.6a8.5 8.5 0 0 1 6-2.4zm0 3.4c1.4 0 2.6.5 3.6 1.4l1.2-1.2A6.8 6.8 0 0 0 8 3.9a6.8 6.8 0 0 0-4.8 1.9L4.4 7A5.1 5.1 0 0 1 8 5.6zm0 3.4c.5 0 1 .2 1.3.5L8 10.8 6.7 9.5c.3-.3.8-.5 1.3-.5z"/></svg><svg aria-hidden="true" width="27" height="13" viewBox="0 0 27 13"><rect x=".5" y=".5" width="23" height="12" rx="3.5" style="fill: none; stroke: currentColor; opacity: .4"/><rect x="2" y="2" width="20" height="9" rx="2" style="fill: currentColor"/><path d="M25 4.5v4a2 2 0 0 0 0-4z" style="fill: currentColor; opacity: .4"/></svg></span>
  </div>
  <div aria-hidden="true" style="position: absolute; left: 50%; top: 11px; width: 124px; height: 36px; margin-left: -62px; border-radius: 20px; background: black; z-index: 40; pointer-events: none"></div>

  <div style="position: absolute; left: 20px; top: 70px" aria-hidden="true">
    <div class="lt">Send</div>
  </div>
  <div class="dimmer"></div>

  <section class="sheet" aria-label="新建 Send" style="top: 58px">
    <div class="grab"></div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 4px 16px 0; height: 56px">
      <a href="iPhone-Send.dc.html" class="gbtn glass" aria-label="取消"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg></a>
      <h1 class="hl m" style="flex: 1; text-align: center">新建 Send</h1>
      <a href="iPhone-Send.dc.html" class="gbtn gprom" aria-label="创建并拷贝链接"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></a>
    </div>

    <div style="padding: 12px 16px 0">
      <div class="seg" role="radiogroup" aria-label="Send 类型">
        <sc-for list="{{types}}" as="t" hint-placeholder-count="2"><button class="{{t.cls}}" role="radio" aria-checked="{{t.checked}}" onClick="{{t.pick}}">{{t.label}}</button></sc-for>
      </div>
    </div>

    <div class="grp" style="margin: 16px 16px 0">
      <label class="row"><span class="bd" style="width: 84px; flex: none">名称</span><input class="field" value="{{name}}" placeholder="只有你能看到" aria-label="名称"></label>
      <sc-if value="{{isText}}" hint-placeholder-val="{{ true }}">
        <label class="row" style="align-items: flex-start; min-height: 84px; padding-top: 14px"><span class="bd" style="width: 84px; flex: none">文本</span><textarea class="field" aria-label="文本" style="resize: none; height: 56px">网络：Home-Guest
密码：sunflower-42-orbit</textarea></label>
        <div class="row"><span class="grow bd">默认隐藏文本</span><button class="{{hideCls}}" role="switch" aria-checked="{{hideOn}}" aria-label="默认隐藏文本" onClick="{{toggleHide}}"></button></div>
      </sc-if>
      <sc-if value="{{isFile}}" hint-placeholder-val="{{ false }}">
        <div class="row"><span class="bd" style="width: 84px; flex: none">文件</span><span class="bd s2 ell" style="flex: 1">{{fileName}}</span></div>
        <button class="row tint" onClick="{{nextFile}}" style="width: 100%; border: 0; background: none; text-align: left"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5h8.5L19 8v12.5H6zM14 3.5V8.5h5"/></svg><span class="bd">选择其他文件</span></button>
      </sc-if>
    </div>

    <div class="hdr">有效期</div>
    <div class="grp" style="margin: 0 16px">
      <button class="row" onClick="{{nextDel}}" style="width: 100%; border: 0; background: none; text-align: left"><span class="grow bd">删除时间</span><span class="bd s2">{{delText}}</span><svg class="ic s s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
      <button class="row" onClick="{{nextExp}}" style="width: 100%; border: 0; background: none; text-align: left"><span class="grow bd">过期时间</span><span class="bd s2">{{expText}}</span><svg class="ic s s2" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 9l4-4 4 4M8 15l4 4 4-4"/></svg></button>
    </div>

    <div class="hdr">访问</div>
    <div class="grp" style="margin: 0 16px">
      <label class="row"><span class="bd" style="width: 120px; flex: none">最大访问次数</span><input class="field" inputmode="numeric" value="10" placeholder="不限" aria-label="最大访问次数" style="text-align: right"></label>
      <label class="row"><span class="bd" style="width: 120px; flex: none">访问密码</span><input class="field" type="password" placeholder="可选" aria-label="访问密码" style="text-align: right"></label>
      <div class="row"><span class="grow bd">隐藏我的邮箱</span><button class="{{emailCls}}" role="switch" aria-checked="{{emailOn}}" aria-label="隐藏我的邮箱" onClick="{{toggleEmail}}"></button></div>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"increaseContrast":{"editor":"boolean","default":false},"$preview":{"width":402,"height":874}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { type: 'text', hide: true, email: true, del: 4, exp: 0, file: 0 };
    this.files = [['租房合同.pdf', '2.4 MB'], ['护照扫描.jpg', '1.1 MB'], ['recovery-codes.txt', '2 KB']];
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const s = this.state;
    return {
      rootClass: (dark ? 'ov dark' : 'ov') + ((this.props.increaseContrast ?? false) ? ' hc' : ''),
      types: [['text', '文本'], ['file', '文件']].map((t) => ({
        label: t[1], cls: s.type === t[0] ? 'on' : '', checked: s.type === t[0] ? 'true' : 'false',
        pick: () => this.setState({ type: t[0] })
      })),
      isText: s.type === 'text', isFile: s.type === 'file',
      delText: ['1 小时后', '1 天后', '2 天后', '3 天后', '7 天后', '30 天后'][s.del],
      nextDel: () => this.setState({ del: (s.del + 1) % 6 }),
      expText: ['不过期', '1 小时后', '1 天后', '7 天后'][s.exp],
      nextExp: () => this.setState({ exp: (s.exp + 1) % 4 }),
      name: s.type === 'text' ? '访客 Wi‑Fi' : this.files[s.file][0],
      fileName: this.files[s.file].join(' · '),
      nextFile: () => this.setState({ file: (s.file + 1) % this.files.length }),
      hideCls: s.hide ? 'tg on' : 'tg', hideOn: s.hide ? 'true' : 'false', toggleHide: () => this.setState({ hide: !s.hide }),
      emailCls: s.email ? 'tg on' : 'tg', emailOn: s.email ? 'true' : 'false', toggleEmail: () => this.setState({ email: !s.email })
    };
  }
}
</script>
</body>
</html>
