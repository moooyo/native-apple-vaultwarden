# xcodegen project spec for Tessera (Vaultwarden-compatible client).
#
# Generated artifact: `Tessera.xcodeproj` (NOT committed — see .gitignore).
# Regenerate with:  brew install xcodegen && xcodegen generate
#
# The pure-Swift libraries live in the local SwiftPM package at the repo root (Package.swift);
# this project consumes that package and adds the App + Extension targets that need
# entitlements / signing (which SwiftPM cannot express). The libraries are still tested
# headlessly via `swift build` / the `*Tests` executable runners.
#
# BEFORE BUILDING:
#   1. // TODO: set DEVELOPMENT_TEAM below to your 10-char Apple Developer Team ID.
#   2. Replace the placeholder bundle ids (dev.moooyo.tessera*) + App Group
#      (group.dev.moooyo.tessera) + the shared Keychain group with your own, and keep them in
#      sync with the entitlements files and Sources/AppShared/AppShared.swift.

name: Tessera

options:
  bundleIdPrefix: dev.moooyo.tessera
  developmentLanguage: zh-Hans
  deploymentTarget:
    iOS: "27.0"
    macOS: "27.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

# The local SwiftPM package at the repo root supplies every library product.
packages:
  Tessera:
    path: .

# Project-wide build settings. DEVELOPMENT_TEAM is intentionally blank — set it before building.
settings:
  base:
    # TODO: set DEVELOPMENT_TEAM to your Apple Developer Team ID (10 chars), or set it per-target
    # / via an .xcconfig. Left empty so the project generates without a hard-coded team.
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.2"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: complete

targetTemplates:
  MacVaultApp:
    type: application
    platform: macOS
    sources:
      - App/macOS/UI
      - App/macOS/Resources
      - App/macOS/App/TesseraMacApp.swift
      - App/Shared
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: OpenVault
    dependencies:
      - {package: Tessera, product: VaultRepository}
      - {package: Tessera, product: UIShared}
      - {package: Tessera, product: DesignSystem}
      - {package: Tessera, product: SyncEngine}
      - {package: Tessera, product: Networking}
      - {package: Tessera, product: KeyVault}
      - {package: Tessera, product: KeychainBridge}
      - {package: Tessera, product: VaultStore}
      - {package: Tessera, product: VaultModels}
      - {package: Tessera, product: CryptoCore}
      - {package: Tessera, product: Generators}
      - {package: Tessera, product: Fido2}
      - {package: Tessera, product: AppShared}
      - {package: Tessera, product: PasskeyHandoff}

  MacAppRelaunch:
    dependencies:
      - target: OpenVaultRelaunchHelper
        link: false
        embed: true
        codeSign: true
        copy:
          destination: wrapper
          subpath: Contents/Helpers

  MacLocalApp:
    templates: [MacVaultApp]
    deploymentTarget: "26.0"
    dependencies:
      - framework: SQLCipher.framework
        implicit: true
        link: false
        embed: true
        codeSign: false
        removeHeaders: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/macOS/Local/OpenVault-Local.entitlements
        PACKAGE_SKIP_AUTO_EMBEDDING_DYNAMIC_BINARY_FRAMEWORKS: YES
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        LIBRARY_LOAD_CONSTRAINT: App/macOS/Local/Libraries.coderequirement
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) OPENVAULT_LOCAL $(OPENVAULT_LOCAL_EXTRA_FLAGS)"
      configs:
        Release:
          CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO

targets:

  # ─────────────────────────────────────────────────────────────────────────────
  # iOS application
  # ─────────────────────────────────────────────────────────────────────────────
  Tessera-iOS:
    type: application
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/iOS/UI
      - path: App/iOS/App
      - path: App/Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera
        PRODUCT_NAME: Tessera
        GENERATE_INFOPLIST_FILE: NO
        # Reference the hand-written plist/entitlements as-is; do NOT let xcodegen
        # generate (and thereby clobber) them.
        INFOPLIST_FILE: App/iOS/App/Info-iOS.plist
        CODE_SIGN_ENTITLEMENTS: App/iOS/App/Tessera-iOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: OpenVault
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Tessera
        product: VaultRepository
      - package: Tessera
        product: UIShared
      - package: Tessera
        product: DesignSystem
      - package: Tessera
        product: SyncEngine
      - package: Tessera
        product: Networking
      - package: Tessera
        product: KeyVault
      - package: Tessera
        product: KeychainBridge
      - package: Tessera
        product: VaultStore
      - package: Tessera
        product: VaultModels
      - package: Tessera
        product: CryptoCore
      - package: Tessera
        product: Generators
      - package: Tessera
        product: Fido2
      - package: Tessera
        product: AppShared
      - package: Tessera
        product: PasskeyHandoff
      - target: TesseraAutoFill-iOS
        embed: true

  # ─────────────────────────────────────────────────────────────────────────────
  # macOS application
  # ─────────────────────────────────────────────────────────────────────────────
  Tessera-macOS:
    templates: [MacVaultApp, MacAppRelaunch]
    deploymentTarget: "27.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera
        PRODUCT_NAME: Tessera
        GENERATE_INFOPLIST_FILE: NO
        # Reference the hand-written plist/entitlements as-is; do NOT let xcodegen
        # generate (and thereby clobber) them.
        INFOPLIST_FILE: App/macOS/App/Info-macOS.plist
        CODE_SIGN_ENTITLEMENTS: App/macOS/App/Tessera-macOS.entitlements
    dependencies:
      - target: TesseraAutoFill-macOS
        embed: true

  OpenVault-Local:
    templates: [MacLocalApp, MacAppRelaunch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera.local
        PRODUCT_NAME: OpenVault

  OpenVaultRelaunchHelper:
    type: tool
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - App/macOS/RelaunchHelper/MacRelaunchHelper.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera.relaunch-helper
        # Start with an ad hoc signature, then sign on copy with the enclosing app's identity.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_ENTITLEMENTS: App/macOS/RelaunchHelper/OpenVaultRelaunchHelper.entitlements
        CODE_SIGN_INJECT_BASE_ENTITLEMENTS: NO
        OTHER_CODE_SIGN_FLAGS: "$(inherited) -i $(PRODUCT_BUNDLE_IDENTIFIER)"
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_DEBUG_DYLIB: NO
        SKIP_INSTALL: YES

  OpenVault-Local-Fixture:
    templates: [MacLocalApp]
    sources: [Tests/Interface/MacLocalFixture]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.openvault.interface-checks.local-fixture
        PRODUCT_NAME: OpenVault-Fixture
        OPENVAULT_LOCAL_EXTRA_FLAGS: OPENVAULT_LOCAL_FIXTURE

  # ─────────────────────────────────────────────────────────────────────────────
  # AutoFill credential-provider extension (iOS)
  #
  # THE 120MB RED LINE: only the least-privilege read stack is linked. Do NOT add
  # Networking / SyncEngine / Generators / VaultRepository / UIShared / UI-* here.
  # ─────────────────────────────────────────────────────────────────────────────
  TesseraAutoFill-iOS:
    type: app-extension
    platform: iOS
    deploymentTarget: "27.0"
    sources:
      - path: App/AutoFill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera.autofill
        PRODUCT_NAME: TesseraAutoFill
        GENERATE_INFOPLIST_FILE: NO
        # Reference the hand-written plist/entitlements as-is; do NOT let xcodegen
        # generate (and thereby clobber the NSExtension/ASCredentialProvider keys).
        INFOPLIST_FILE: App/AutoFill/Info-AutoFill.plist
        CODE_SIGN_ENTITLEMENTS: App/AutoFill/Tessera-AutoFill.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - package: Tessera
        product: VaultReader
      - package: Tessera
        product: KeychainBridge
      - package: Tessera
        product: Fido2
      - package: Tessera
        product: DesignSystem
      - package: Tessera
        product: VaultModels
      - package: Tessera
        product: AppShared
      - package: Tessera
        product: PasskeyHandoff

  # ─────────────────────────────────────────────────────────────────────────────
  # AutoFill credential-provider extension (macOS)
  # ─────────────────────────────────────────────────────────────────────────────
  TesseraAutoFill-macOS:
    type: app-extension
    platform: macOS
    deploymentTarget: "27.0"
    sources:
      - path: App/AutoFill
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.moooyo.tessera.autofill
        PRODUCT_NAME: TesseraAutoFill
        GENERATE_INFOPLIST_FILE: NO
        # Reference the hand-written plist/entitlements as-is; do NOT let xcodegen
        # generate (and thereby clobber the NSExtension/ASCredentialProvider keys).
        INFOPLIST_FILE: App/AutoFill/Info-AutoFill.plist
        CODE_SIGN_ENTITLEMENTS: App/AutoFill/Tessera-AutoFill-macOS.entitlements
    dependencies:
      - package: Tessera
        product: VaultReader
      - package: Tessera
        product: KeychainBridge
      - package: Tessera
        product: Fido2
      - package: Tessera
        product: DesignSystem
      - package: Tessera
        product: VaultModels
      - package: Tessera
        product: AppShared
      - package: Tessera
        product: PasskeyHandoff

schemes:
  OpenVault-Local:
    build:
      targets:
        OpenVault-Local: all
    run:
      config: Debug
  OpenVault-Local-Fixture:
    build:
      targets:
        OpenVault-Local-Fixture: all
    run:
      config: Release
  Tessera-iOS:
    build:
      targets:
        Tessera-iOS: all
        TesseraAutoFill-iOS: all
    run:
      config: Debug
  Tessera-macOS:
    build:
      targets:
        Tessera-macOS: all
        TesseraAutoFill-macOS: all
    run:
      config: Debug
